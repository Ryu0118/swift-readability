# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: "/Applications/Xcode_27.0.app/Contents/Developer"

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: swift build -v
    - name: Test
      run: swift test -v

  example-app-build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: "/Applications/Xcode_27.0.app/Contents/Developer"

    steps:
    - uses: actions/checkout@v7
    - name: Build Example app
      run: |
        xcodebuild build \
          -project Example/ReadabilityTest/ReadabilityTest.xcodeproj \
          -scheme ReadabilityTest \
          -destination "platform=iOS Simulator,name=iPhone 17"

  example-app-test:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: "/Applications/Xcode_27.0.app/Contents/Developer"

    steps:
    - uses: actions/checkout@v7
    - name: Test library via Example app's simulator
      run: |
        xcodebuild test \
          -project Example/ReadabilityTest/ReadabilityTest.xcodeproj \
          -scheme ReadabilityTests \
          -destination "platform=iOS Simulator,name=iPhone 17"
